name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build-tests
      - name: Build
        run: cmake --build build-tests
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Install make
        # libmicroros.mk runs through make, which the IDF image does not ship.
        run: apt-get update && apt-get install -y --no-install-recommends make
      - name: Prepare micro-ROS prebuilt
        run: tools/prepare_build.sh
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: leap_ros-firmware
          path: |
            build/leap_ros.bin
            build/merged-binary.bin
