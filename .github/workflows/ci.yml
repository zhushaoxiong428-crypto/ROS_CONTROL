name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build-host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-host -j
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: ESP32-S3 firmware build
    runs-on: ubuntu-22.04
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: leap_low_v1
          path: |
            build/leap_low_v1.bin
            build/merged-binary.bin
