name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S tests -B build-host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-host -j
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: ESP32-S3 firmware build
    runs-on: ubuntu-22.04
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v5
      # micro-ROS 组件在 CMake 配置阶段调用 make 检查预编译库是否需要重编。
      - name: Install make
        run: apt-get update && apt-get install -y --no-install-recommends make
      - name: Use committed micro-ROS prebuilt library
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/fix_microros_timestamps.sh
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          set -o pipefail
          if ! idf.py build 2>&1 | tee build.log; then
            # 把失败日志末尾作为注解输出，未登录也能在运行摘要里看到原因。
            grep -nE "error|Error|FAILED" build.log | tail -n 20 | while IFS= read -r line; do
              echo "::error title=build::${line}"
            done
            tail -n 15 build.log | while IFS= read -r line; do
              echo "::error title=tail::${line}"
            done
            exit 1
          fi
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: leap_low_v1
          path: |
            build/leap_low_v1.bin
            build/merged-binary.bin
